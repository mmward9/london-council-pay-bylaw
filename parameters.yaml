# Effective date note for the renderer. The operative bylaw text already
# specifies effective date (enacting clause 3) and first-applicable-year
# behaviour (s. 4.5(f)).
bylaw_effective_date_note: |
  Effective the day of passage. Section 4.5 first applies to remuneration for
  the first fiscal year beginning on or after passage, comparing the residential
  municipal tax rate set in that year's annual rating by-law (Municipal Act
  s. 312(2)), adjusted by the reassessment adjustment factor, to the residential
  municipal tax rate for the immediately preceding fiscal year. Only the portion
  of the resulting constant-assessment increase above the CPI allowance adds to
  the accumulated decrement; a decrease erodes it, to a floor of zero.
